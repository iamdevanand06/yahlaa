<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Card Center Shadow Effect</title>

<style>
    body{
        margin:0;
        font-family:Arial, sans-serif;
        background:#f4f4f4;
    }

    .container{
        width:300px;
        margin:auto;
        padding:50px 0;
    }

    .card{
        height:120px;
        background:white;
        margin:25px 0;
        border-radius:12px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:24px;
        transition:0.3s ease;
    }

    /* Shadow when card reaches center */
    .active{
        transform:scale(1.03);
        box-shadow:0 10px 30px rgba(0,0,0,0.35);
    }

    /* Optional center guide line */
    /* .center-line{
        position:fixed;
        top:50%;
        left:0;
        width:100%;
        height:2px;
        background:red;
        transform:translateY(-50%);
        pointer-events:none;
        z-index:1000;
    } */
</style>
</head>

<body>

<div class="center-line"></div>

<div class="container">
    <!-- 65 cards -->
    <script>
        for(let i=1;i<=65;i++){
            document.write(`<div class="card">Card ${i}</div>`);
        }
    </script>
</div>

<script>
const cards = document.querySelectorAll(".card");

function checkCenterCard() {

    const centerY = window.innerHeight / 2;

    cards.forEach(card => {

        const rect = card.getBoundingClientRect();

        const cardCenter = rect.top + rect.height / 2;

        // If card center is near screen center
        if(Math.abs(centerY - cardCenter) < rect.height / 2){
            card.classList.add("active");
        } else {
            card.classList.remove("active");
        }
    });
}

window.addEventListener("scroll", checkCenterCard);

checkCenterCard();
</script>

</body>
</html>
